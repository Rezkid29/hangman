services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: hangman-dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"

  api:
    build: ./server
    container_name: hangman-api
    ports:
      - "3001:3001"
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      PLAYERS_TABLE: HangmanPlayers
      PORT: "3001"
    depends_on:
      - dynamodb-local

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        NGINX_CONF: nginx.compose.conf
    container_name: hangman-react
    ports:
      - "8080:80"
    depends_on:
      - api
