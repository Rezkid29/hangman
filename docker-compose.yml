services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: hangman-dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8000/shell/ >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s
    ports:
      - "8000:8000"

  api:
    build: ./server
    container_name: hangman-api
    ports:
      - "3001:3001"
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      PLAYERS_TABLE: HangmanPlayers
      PORT: "3001"
    restart: on-failure
    depends_on:
      dynamodb-local:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        NGINX_CONF: nginx.compose.conf
    container_name: hangman-react
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
